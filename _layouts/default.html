<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }}</title>
  <link rel="stylesheet" href="{{ "/assets/style.css" | relative_url }}">
  {{ content_for_head }}
</head>
<body>
  <header>
    <h1>{{ site.title }}</h1>
  </header>

  <aside class="sidebar">
    {{ content_for_sidebar }}
  </aside>

  <main>
    {{ content }}
  </main>

  <div class="toc-wrapper">
    {{ content_for_toc }}
    <div id="graph-container">
      <div class="graph-title">Interaktiver Graph</div>
      <div class="graph">
        <!-- Mermaid Graph aus Markdown wird hier gerendert -->
        {{ content_for_graph }}
      </div>
    </div>
  </div>

  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
    mermaid.initialize({ startOnLoad: true });
  </script>
</body>
</html>
