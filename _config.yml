title: 'KI-Wiki'
description: 'Wiki zum Einsatz Künstlicher Intelligenz in Bildungsprozessen'
remote_theme: just-the-docs/just-the-docs

# Navigation Sidebar
just-the-docs:
    collections:
        pages: 
            name: Wiki
            nav_exlude: false
            search_exclude: false
            
# Artikel TOC
markdown: kramdown
kramdown:
    toc_levels: 1..6
    
plugins:
  - jekyll-remote-theme

# Navigation & Struktur
nav_sort: case_sensitive    