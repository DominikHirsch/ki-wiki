title: 'KI-Wiki'
description: 'Wiki zum Einsatz Künstlicher Intelligenz in Bildungsprozessen'
remote_theme: "minimal-mistakes-jekyll"

minimal_mistakes_skin: "sunrise" # "default" "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise"


defaults:
  -
    scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
      toc: true              # On-page ToC aktivieren
      toc_levels: "2..3"     # Tiefe der ToC (##, ###)
      nav_order: 0
      sidebar: true          # Globale Navigation links

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  
markdown: kramdown
kramdown:
  input: GFM